name: heig
channels:
 - defaults
 - conda-forge
dependencies:
 - python=3.11
 # hail runs on a JVM through pyspark and does not bundle one;
 # hail 0.2.130 requires Java 8 or 11
 - conda-forge::openjdk=8
 - pip
 # the remaining dependencies are only distributed on PyPI
 - pip:
   - -r requirements.txt
